server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for large JSON data files
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cache JSON data files (but allow revalidation)
    location /data/ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # Proxy Bitrix24 webhook calls to avoid CORS issues
    location /api/bitrix/ {
        proxy_pass https://hogaresfuncionales.bitrix24.es/rest/9946/5itdztxrr5vfefrg/;
        proxy_ssl_server_name on;
        proxy_set_header Host hogaresfuncionales.bitrix24.es;
        proxy_set_header Accept application/json;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Length $content_length;
        proxy_pass_request_body on;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
    }

    # OpenRouter API proxy — keeps API key server-side
    location /api/openrouter/ {
        proxy_pass https://openrouter.ai/api/v1/;
        proxy_ssl_server_name on;
        proxy_set_header Host openrouter.ai;
        proxy_set_header Authorization "Bearer ${OPENROUTER_API_KEY}";
        proxy_set_header Content-Type application/json;
        proxy_set_header HTTP-Referer "https://ecs-aragroupcr.grayhill-769056ba.eastus2.azurecontainerapps.io";
        proxy_set_header X-Title "ECS Lead Intelligence";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin *;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # SPA fallback — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status":"ok","app":"ecs-aragroupcr"}';
        add_header Content-Type application/json;
    }
}
