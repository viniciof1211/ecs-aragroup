<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/ecs-logo-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/ecs-logo-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A4A28" />
    <meta name="description" content="ECS — Engagement Continuum Score | Lead Intelligence Platform | ARA Group Costa Rica" />
    <title>ECS — Lead Intelligence | ARA Group</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, src, line, col, err) {
        var el = document.getElementById('root');
        if (el) el.innerHTML = '<pre style="padding:32px;color:#b00;font-family:monospace;white-space:pre-wrap">' +
          'GLOBAL ERROR:\n' + msg + '\n\nSource: ' + src + ':' + line + ':' + col +
          '\n\n' + (err && err.stack ? err.stack : '') + '</pre>';
      };
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('root');
        if (el && !el.hasChildNodes()) el.innerHTML = '<pre style="padding:32px;color:#b00;font-family:monospace;white-space:pre-wrap">' +
          'UNHANDLED REJECTION:\n' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '</pre>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
